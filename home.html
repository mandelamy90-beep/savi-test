<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | My Feed - Savi</title>
    <meta name="author" content="Savi Softworks Ltd">
    <meta name="description"
        content="Savi is a safe, trustworthy all-in-one social media platform for users between the ages of 10 and 16 years old.">
    <meta name="keywords" content="savi, social, social media, savi softworks, savi social, savi platform">
    <link rel="apple-touch-icon" href="./SaviLogo.png">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Savi Softworks Ltd",
      "url": "https://example.ie",
      "image": "./SaviLogo.png",
      "logo": "./SaviLogo.png",
      "email": "savi@example.ie",
      "sameAs": [
        "https://twitter.com/savi",
        "https://facebook.com/savi"
      ]
    }
    </script>

    <style>
        body {
            margin: 0;
            background: #d8d3d3;
            font-family: Arial, Helvetica, sans-serif;

            display: grid;
            grid-template-columns: 230px 1fr 260px;

            min-height: 100vh;
        }

        /* LEFT SIDEBAR */

        .sidebar {

            border-right: 3px solid black;

            padding: 35px;

            display: flex;
            flex-direction: column;
        }

        .logo {

            font-size: 64px;
            margin-top: 0;
            margin-bottom: 40px;
            font-family: Georgia, serif;
            font-style: italic;
        }

        nav {

            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        nav a {

            color: black;
            text-decoration: none;
            font-size: 40px;
        }

        .createBtn {

            margin-top: auto;

            width: 180px;

            font-size: 34px;

            border: 4px solid black;
            border-radius: 18px;

            background: white;

            cursor: pointer;
        }

        .profile {

            display: flex;
            align-items: center;
            gap: 18px;

            margin-top: 60px;
        }

        .avatar {

            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: black;
        }

        /* CENTER */

        .feed {

            padding: 40px 60px;
        }

        .feed h1 {

            margin-top: 0;

            font-size: 62px;
        }

        .post {

            background: black;

            border-radius: 10px;

            margin-bottom: 30px;
        }

        .large {

            height: 380px;
        }

        .small {

            height: 90px;
        }

        .medium {

            height: 220px;
        }

        /* RIGHT */

        .rightbar {

            border-left: 3px solid black;

            padding: 40px;
        }

        .rightbar h3 {

            margin-top: 0;

            font-size: 36px;
        }

        .suggestion {

            margin-bottom: 18px;

            font-size: 24px;
        }

        /* MOBILE */

        @media(max-width:1100px) {

            body {

                grid-template-columns: 1fr;

            }

            .sidebar {

                border-right: none;
                border-bottom: 2px solid black;

            }

            .rightbar {

                border-left: none;
                border-top: 2px solid black;

            }

        }

        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1;
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgb(0, 0, 0);
            /* Fallback color */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
        }

        /* Modal Content/Box */
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            /* Could be more or less, depending on screen size */
        }

        /* The Close Button */
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
    <!-- <script src="./authenticationHandle.js"></script> -->
    <script src="./modalHandle.js"></script>
</head>

<body>

    <aside class="sidebar">
        <h1 class="logo">Savi</h1>

        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Recents</a>
        </nav>

        <button class="createBtn" id="createPost">
            Create
        </button>

        <div class="profile">
            <div class="avatar"></div>
            <span>Username ▼</span>
        </div>
    </aside>

    <main class="feed">

        <h1>My Feed</h1>

        <div class="post large"></div>

        <div class="post small"></div>

        <div class="post medium"></div>

    </main>

    <aside class="rightbar">

        <h3>You May Know</h3>

        <div class="suggestion">Profile</div>
        <div class="suggestion">Profile</div>
        <div class="suggestion">More Profiles</div>

    </aside>

    <!-- Modal -->
    <div id="myModal" class="modal">

        <div class="modal-content">

            <span class="close">&times;</span>

            <p>Some text in the Modal..</p>

        </div>

    </div>

</body>

</html>
